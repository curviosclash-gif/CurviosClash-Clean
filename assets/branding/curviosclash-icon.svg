<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">CurviosClash product icon</title>
  <desc id="desc">Two luminous curved trails collide inside a dark rounded arena.</desc>
  <metadata>
    Original geometric artwork created specifically for CurviosClash on 2026-07-13.
    No external artwork, font, logo, or model was used.
  </metadata>
  <defs>
    <linearGradient id="arena" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071526"/>
      <stop offset="0.55" stop-color="#111a3c"/>
      <stop offset="1" stop-color="#230f35"/>
    </linearGradient>
    <linearGradient id="cyanTrail" x1="190" y1="800" x2="835" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#087caa"/>
      <stop offset="0.55" stop-color="#19d5ec"/>
      <stop offset="1" stop-color="#d8ffff"/>
    </linearGradient>
    <linearGradient id="magentaTrail" x1="190" y1="205" x2="830" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb7f2"/>
      <stop offset="0.5" stop-color="#f23fbd"/>
      <stop offset="1" stop-color="#8a237e"/>
    </linearGradient>
    <radialGradient id="impact" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#c9ffff"/>
      <stop offset="0.62" stop-color="#7de8ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#7de8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="54" y="54" width="916" height="916" rx="214" fill="url(#arena)"/>
  <rect x="67" y="67" width="890" height="890" rx="201" fill="none" stroke="#80efff" stroke-opacity="0.28" stroke-width="8"/>
