name: Windows package check

on:
  push:
    paths:
      - electron/**
      - assets/branding/**
      - START_CURVIOSCLASH.cmd
      - dev/vite/**
      - scripts/check-packaged-electron.mjs
      - package.json
      - package-lock.json
      - vite.config.js
      - .github/workflows/package-check.yml
  pull_request:
    paths:
      - electron/**
      - assets/branding/**
      - START_CURVIOSCLASH.cmd
      - dev/vite/**
      - scripts/check-packaged-electron.mjs
      - package.json
      - package-lock.json
      - vite.config.js
      - .github/workflows/package-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm --prefix electron ci
      - name: Build Windows package
        run: npm run app:package
      - name: Verify package contents and launch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $PWD 'release'
          $exe = Join-Path $release 'win-unpacked\CurviosClash.exe'
          $installer = Get-ChildItem -LiteralPath $release -Filter 'CurviosClash Setup *.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer is missing.' }

          $requiredFiles = @(
            $exe,
            (Join-Path $release 'win-unpacked\resources\dist-app\index.html'),
            (Join-Path $release 'win-unpacked\resources\server\lan-signaling.js'),
            (Join-Path $release 'win-unpacked\resources\app.asar'),
            (Join-Path $release 'win-unpacked\resources\app.asar.unpacked\node_modules\ffmpeg-static\ffmpeg.exe')
          )
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Required package file is missing: $requiredFile"
            }
          }

          $asar = Join-Path $release 'win-unpacked\resources\app.asar'
          $asarEntries = & .\electron\node_modules\.bin\asar.cmd list $asar
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect app.asar.' }
          foreach ($entry in @(
            '\entry.cjs',
            '\main.cjs',
            '\preload.cjs',
            '\recording-video-export-job.cjs',
            '\settings-studio\main.cjs',
            '\settings-studio\preload.cjs',
            '\settings-studio\ui\settings-studio.html'
          )) {
            if ($asarEntries -notcontains $entry) {
              throw "Required app.asar entry is missing: $entry"
            }
          }

          $versionInfo = (Get-Item -LiteralPath $exe).VersionInfo
          if ($versionInfo.ProductName -ne 'CurviosClash') {
            throw "Unexpected packaged product name: $($versionInfo.ProductName)"
          }

          Add-Type -AssemblyName System.Drawing
          foreach ($artifact in @($exe, $installer.FullName)) {
            $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($artifact)
            if ($null -eq $icon) { throw "Windows icon is missing: $artifact" }
            try {
              if ($icon.Width -lt 16 -or $icon.Height -lt 16) {
                throw "Windows icon is invalid: $artifact"
              }
            } finally {
              $icon.Dispose()
            }
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          Write-Host "Packaged executable signature status: $($signature.Status)"

          npm run app:package:verify -- $exe
