name: Desktop integration

on:
  schedule:
    - cron: '17 2 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - src/**
      - electron/**
      - assets/**
      - START_CURVIOSCLASH.cmd
      - '*.bat'
      - server.ps1
      - scripts/start-editor.ps1
      - server/**
      - editor/**
      - prototypes/vehicle-lab/**
      - tests/**
      - scripts/run-playwright-*.mjs
      - scripts/playwright-*.mjs
      - scripts/build-playwright-app.mjs
      - scripts/vite-build.mjs
      - scripts/esbuild-stream-fallback.cjs
      - playwright.config.js
      - playwright.editor.config.mjs
      - index.html
      - hangar.html
      - style.css
      - app-shell.css
      - dev/vite/**
      - vite.config.js
      - package.json
      - package-lock.json
      - scripts/install-electron-runtime.mjs
      - electron/package.json
      - electron/package-lock.json
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - src/**
      - electron/**
      - assets/**
      - START_CURVIOSCLASH.cmd
      - '*.bat'
      - server.ps1
      - scripts/start-editor.ps1
      - server/**
      - editor/**
      - prototypes/vehicle-lab/**
      - tests/**
      - scripts/run-playwright-*.mjs
      - scripts/playwright-*.mjs
      - scripts/build-playwright-app.mjs
      - scripts/vite-build.mjs
      - scripts/esbuild-stream-fallback.cjs
      - playwright.config.js
      - playwright.editor.config.mjs
      - index.html
      - hangar.html
      - style.css
      - app-shell.css
      - dev/vite/**
      - vite.config.js
      - package.json
      - package-lock.json
      - scripts/install-electron-runtime.mjs
      - electron/package.json
      - electron/package-lock.json
      - .github/workflows/desktop.yml

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-renderer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build test renderer once
        run: npm run build:app:test
      - name: Upload test renderer
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-renderer
          path: dist-app-test
          if-no-files-found: error
          retention-days: 1

  smoke:
    needs: build-test-renderer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm run app:setup
      - name: Download test renderer
        uses: actions/download-artifact@v8
        with:
          name: desktop-test-renderer
          path: dist-app-test
      - name: Desktop smoke
        run: node scripts/run-playwright-smoke.mjs tests/core.spec.js --timeout=180000

  e2e:
    needs: build-test-renderer
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cluster:
          - core-shell
          - core-platform
          - core-surface
          - core-runtime
          - core-regressions
          - network
          - desktop-flows
          - gameplay-smoke
          - editor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm run app:setup
      - name: Download test renderer
        if: ${{ matrix.cluster != 'network' }}
        uses: actions/download-artifact@v8
        with:
          name: desktop-test-renderer
          path: dist-app-test
      - name: Install Playwright browser
        if: ${{ matrix.cluster == 'network' }}
        run: npx playwright install chromium
      - name: Run ${{ matrix.cluster }} cluster
        run: node scripts/run-playwright-targeted-clusters.mjs ${{ matrix.cluster }} --timeout=180000

  heavy-e2e:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    needs: build-test-renderer
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cluster:
          - physics-core
          - physics-hunt
          - physics-policy
          - gpu-stress
          - ghost-selfduel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci
      - run: npm run app:setup
      - name: Download test renderer
        uses: actions/download-artifact@v8
        with:
          name: desktop-test-renderer
          path: dist-app-test
      - name: Run ${{ matrix.cluster }} cluster
        run: node scripts/run-playwright-targeted-clusters.mjs ${{ matrix.cluster }} --timeout=240000

  browser-compat:
    needs: smoke
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install chromium
      - name: Browser compatibility smoke
        run: npm run test:browser:compat
